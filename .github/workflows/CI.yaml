name: CI

# Uses `pull_request` (NOT pull_request_target): PR code runs here, so the token
# is read-only for fork PRs and no secrets are exposed. Keep it that way.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

# A new push to the same PR cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate sample registry is well-formed JSON
        run: python -m json.tool trust-registry.json > /dev/null

      - name: Byte-compile (catches syntax errors)
        run: python -m compileall -q wot_bot tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test (dry run, no token needed; unreachable peers are skipped)
        run: |
          cat > /tmp/event.json <<'EOF'
          {"action":"opened","pull_request":{"number":1,"user":{"login":"alice-dev"}},"repository":{"full_name":"acme/app"}}
          EOF
          python -m wot_bot.main --event-path /tmp/event.json --registry trust-registry.json --dry-run

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check wot_bot tests --select E,F,W,I --ignore E501